<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EverTrak</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial;background:#eef1f4}.box{width:min(390px,90vw);background:white;padding:34px;border-radius:16px;box-shadow:0 12px 40px #0002}h1{margin:0 0 6px;font-size:30px}p{color:#667085}input{width:100%;padding:12px;border:1px solid #ccd3dc;border-radius:8px;margin:8px 0 12px}button{width:100%;padding:12px;border:0;border-radius:8px;background:#1f5eff;color:white;font-weight:800}.err{color:#b42318}</style></head>
<body><form class="box" method="post"><h1>EverTrak</h1><p>Bid Tracking</p>{% if err %}<div class="err">{{err}}</div>{% endif %}<input type="password" name="password" placeholder="Password" required autofocus><button>Sign in</button></form></body></html>
